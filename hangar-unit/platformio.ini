[env]
lib_deps =
    symlink://../common

[env:pico2w]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2w
framework = arduino
board_build.core = earlephilhower
lib_deps =
    ${env.lib_deps}
    adafruit/DHT sensor library

[env:native]
platform = native
test_framework = unity