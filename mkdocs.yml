site_name: Drone-in-a-Box System
site_description: Distributed Edge-to-Cloud IoT System Documentation
theme:
  name: material
  palette:
    scheme: slate

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - admonition
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Analysis: analysis.md
  - Architecture: architecture.md
  - Protocol: protocol.md
  - Behaviour: behaviour.md
  - Design:
      - Control: design/control.md
      - Hangar: design/hangar.md
      - Drone: design/drone.md
      - Backend and dashboard: design/backend.md
      - Simulators: design/simulators.md
  - Hardware: hardware.md
  - Testing: testing.md
  - Deployment: deployment.md
  - Conclusions: conclusions.md